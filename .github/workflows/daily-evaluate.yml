name: Daily Prediction & Evaluation Pipeline

# ─────────────────────────────────────────────────────────────────────
# MLOps Daily Loop:
#   1. Fetch latest market data (gold, USD/INR, macro, sentiment)
#   2. Evaluate yesterday's prediction against actual price
#   3. Log accuracy metrics and detect model drift
#   4. Generate tomorrow's prediction and save as pending
#   5. If drift detected → trigger weekly-retrain workflow
#   6. Commit all data and redeploy
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Run Mon-Fri at 7:00 PM UTC (12:30 AM IST next day)
    # After US markets close (4 PM ET = 8 PM UTC in summer, 9 PM in winter)
    # 7 PM UTC ensures closing prices are available
    - cron: '0 19 * * 1-5'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force model retraining even without drift'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # Required to trigger other workflows

jobs:
  daily-pipeline:
    name: Daily Evaluate → Predict → Monitor
    runs-on: ubuntu-latest

    outputs:
      drift_detected: ${{ steps.evaluate.outputs.drift_detected }}
      direction_accuracy: ${{ steps.evaluate.outputs.direction_accuracy }}
      avg_mape: ${{ steps.evaluate.outputs.avg_mape }}

    steps:
      # ── 1. Setup ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r ml/requirements.txt

      # ── 2. Update Market Data ───────────────────────────────────────
      - name: Fetch latest gold & USD/INR prices
        run: |
          cd ml
          python update_data.py

      # ── 3. Fetch News Sentiment ─────────────────────────────────────
      - name: Log today's gold market sentiment
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          cd ml
          python sentiment_service.py --refresh
        continue-on-error: true

      # ── 4. Evaluate Yesterday's Prediction ──────────────────────────
      - name: Evaluate prediction accuracy & detect drift
        id: evaluate
        run: |
          cd ml
          python evaluate.py | tee /tmp/eval_output.txt

          # Parse drift detection results for downstream decisions
          if grep -q "DRIFT DETECTED" /tmp/eval_output.txt; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
          fi

          # Extract metrics for job summary
          MAPE=$(grep "Average MAPE" /tmp/eval_output.txt | grep -oP '[\d.]+' | head -1 || echo "N/A")
          DIR=$(grep "Direction Accuracy" /tmp/eval_output.txt | grep -oP '[\d.]+' | head -1 || echo "N/A")
          echo "avg_mape=$MAPE" >> $GITHUB_OUTPUT
          echo "direction_accuracy=$DIR" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── 5. Commit Updated Data ──────────────────────────────────────
      - name: Commit daily data updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add \
            "dataset/Gold Rate.csv" \
            dataset/USD-INR.csv \
            dataset/macro_data.csv \
            dataset/prediction_logs.csv \
            dataset/sentiment_logs.csv \
            ml/model/pending_prediction.json \
            ml/model/system_status.json \
            2>/dev/null || true
          git diff --staged --quiet || git commit -m "daily: evaluate + predict $(date -u '+%Y-%m-%d') [skip ci]"
          git push
        continue-on-error: true

      # ── 6. Trigger Render Redeploy ──────────────────────────────────
      - name: Trigger Render deployment
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deployment triggered"

      # ── 7. Generate Job Summary ─────────────────────────────────────
      - name: Write job summary
        run: |
          echo "## Daily Pipeline Results - $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Avg MAPE | ${{ steps.evaluate.outputs.avg_mape }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Direction Accuracy | ${{ steps.evaluate.outputs.direction_accuracy }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Drift Detected | ${{ steps.evaluate.outputs.drift_detected }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.evaluate.outputs.drift_detected }}" = "true" ]; then
            echo "> **Warning:** Model drift detected. Weekly retrain will be triggered." >> $GITHUB_STEP_SUMMARY
          else
            echo "> Model performance within thresholds." >> $GITHUB_STEP_SUMMARY
          fi

  # ── Auto-Retrain on Drift ──────────────────────────────────────────
  trigger-retrain:
    name: Auto-Retrain (Drift Detected)
    needs: daily-pipeline
    if: needs.daily-pipeline.outputs.drift_detected == 'true' || github.event.inputs.force_retrain == 'true'
    uses: ./.github/workflows/weekly-retrain.yml
    secrets: inherit
