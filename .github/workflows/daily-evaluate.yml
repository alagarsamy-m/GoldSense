name: Daily Prediction, Snapshot, and Notification Pipeline

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force model retraining even without drift'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    outputs:
      drift_detected: ${{ steps.evaluate.outputs.drift_detected }}
      direction_accuracy: ${{ steps.evaluate.outputs.direction_accuracy }}
      avg_mape: ${{ steps.evaluate.outputs.avg_mape }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install -r backend/requirements.txt

      - name: Fetch latest market data
        run: |
          cd ml
          python update_data.py

      - name: Refresh market sentiment
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          cd ml
          python sentiment_service.py --refresh
        continue-on-error: true

      - name: Evaluate pending forecasts
        id: evaluate
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          cd ml
          python evaluate.py
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('model/system_status.json').read_text(encoding='utf-8'))
          drift = status.get('drift', {})
          rolling = status.get('rolling_metrics', {}).get('last_7', {})
          with open(Path.cwd().parent / '.github' / 'daily_outputs.txt', 'w', encoding='utf-8') as handle:
              handle.write(f"drift_detected={'true' if drift.get('drift_detected') else 'false'}\n")
              handle.write(f"avg_mape={rolling.get('avg_mape', '0')}\n")
              handle.write(f"direction_accuracy={rolling.get('direction_accuracy', '0')}\n")
          PY
          cat ../.github/daily_outputs.txt >> $GITHUB_OUTPUT

      - name: Generate public snapshots
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          cd ml
          python generate_public_snapshots.py

      - name: Send daily push notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          cd backend
          python send_daily_notifications.py
        continue-on-error: true

      - name: Commit updated artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add \
            "dataset/Gold Rate.csv" \
            dataset/USD-INR.csv \
            dataset/macro_data.csv \
            dataset/prediction_logs.csv \
            dataset/sentiment_logs.csv \
            frontend/public/snapshots/*.json \
            ml/model/pending_prediction.json \
            ml/model/system_status.json \
            2>/dev/null || true
          git diff --staged --quiet || git commit -m "daily: evaluate + snapshot $(date -u '+%Y-%m-%d') [skip ci]"
          git push
        continue-on-error: true

      - name: Trigger Render deployment
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deployment triggered"

      - name: Write job summary
        run: |
          echo "## Daily GoldSense Pipeline - $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Avg D1 MAPE | ${{ steps.evaluate.outputs.avg_mape }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| D1 Direction Accuracy | ${{ steps.evaluate.outputs.direction_accuracy }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Drift Detected | ${{ steps.evaluate.outputs.drift_detected }} |" >> $GITHUB_STEP_SUMMARY

  trigger-retrain:
    needs: daily-pipeline
    if: needs.daily-pipeline.outputs.drift_detected == 'true' || github.event.inputs.force_retrain == 'true'
    uses: ./.github/workflows/weekly-retrain.yml
    secrets: inherit
