name: Daily Prediction, Snapshot, and Notification Pipeline

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goldsense-artifact-pipeline-main
  cancel-in-progress: false

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install -r backend/requirements.txt

      - name: Fetch latest market data
        run: |
          cd ml
          python update_data.py

      - name: Refresh market sentiment
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          cd ml
          python sentiment_service.py --refresh
        continue-on-error: true

      - name: Evaluate pending forecasts
        id: evaluate
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          DAILY_OUTPUT_FILE: ${{ runner.temp }}/goldsense-daily-outputs.txt
        run: |
          cd ml
          python evaluate.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = json.loads(Path('model/system_status.json').read_text(encoding='utf-8'))
          drift = status.get('drift', {})
          rolling = status.get('rolling_metrics', {}).get('last_7', {})
          output_path = Path(os.environ['DAILY_OUTPUT_FILE'])
          output_path.write_text(
              "\n".join(
                  [
                      f"drift_detected={'true' if drift.get('drift_detected') else 'false'}",
                      f"avg_mape={rolling.get('avg_mape', '0')}",
                      f"direction_accuracy={rolling.get('direction_accuracy', '0')}",
                      f"drift_message={str(drift.get('message', 'n/a')).replace(chr(10), ' ')}",
                      f"retrain_recommended={'true' if drift.get('retrain_recommended') else 'false'}",
                  ]
              )
              + "\n",
              encoding='utf-8',
          )
          PY
          cat "$DAILY_OUTPUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate public snapshots
        id: snapshots
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          SNAPSHOT_OUTPUT_FILE: ${{ runner.temp }}/goldsense-snapshot-outputs.txt
        run: |
          cd ml
          python generate_public_snapshots.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          today_path = Path.cwd().parent / 'frontend' / 'public' / 'snapshots' / 'today.json'
          today = json.loads(today_path.read_text(encoding='utf-8'))
          output_path = Path(os.environ['SNAPSHOT_OUTPUT_FILE'])
          output_path.write_text(
              "\n".join(
                  [
                      f"today_source={today.get('source', 'unknown')}",
                      f"today_market_status={today.get('market_status', 'unknown')}",
                      f"today_is_live={'true' if today.get('is_live') else 'false'}",
                  ]
              )
              + "\n",
              encoding='utf-8',
          )
          PY
          cat "$SNAPSHOT_OUTPUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Send daily push notifications
        id: notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NOTIFICATION_RESULT_FILE: ${{ runner.temp }}/goldsense-notification-result.json
          NOTIFICATION_STDERR_FILE: ${{ runner.temp }}/goldsense-notification-result.stderr
          NOTIFICATION_STATUS_FILE: ${{ runner.temp }}/goldsense-notification-status.txt
          NOTIFICATION_OUTPUT_FILE: ${{ runner.temp }}/goldsense-notification-outputs.txt
        run: |
          status=0
          cd backend
          python -u send_daily_notifications.py > "$NOTIFICATION_RESULT_FILE" 2> "$NOTIFICATION_STDERR_FILE" || status=$?
          cd ..
          printf '%s' "$status" > "$NOTIFICATION_STATUS_FILE"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ['NOTIFICATION_RESULT_FILE'])
          stderr_path = Path(os.environ['NOTIFICATION_STDERR_FILE'])
          status_path = Path(os.environ['NOTIFICATION_STATUS_FILE'])

          result_text = result_path.read_text(encoding='utf-8').strip() if result_path.exists() else ''
          stderr_text = stderr_path.read_text(encoding='utf-8').strip() if stderr_path.exists() else ''
          exit_status = int(status_path.read_text(encoding='utf-8').strip() or '0') if status_path.exists() else 0

          if result_text:
              try:
                  payload = json.loads(result_text)
              except json.JSONDecodeError:
                  payload = {
                      "ok": False,
                      "sent": 0,
                      "failed": 0,
                      "status": "error",
                      "reason": "notification_result_invalid_json",
                  }
          else:
              stderr_reason = stderr_text.splitlines()[-1] if stderr_text else "notification_result_missing"
              payload = {
                  "ok": False,
                  "sent": 0,
                  "failed": 0,
                  "status": "error",
                  "reason": stderr_reason,
              }

          if exit_status != 0:
              payload["ok"] = False
              payload.setdefault("status", "error")

          reason = str(payload.get('reason', '')).replace('\n', ' ').replace('\r', ' ')
          output_path = Path(os.environ['NOTIFICATION_OUTPUT_FILE'])
          output_path.write_text(
              "\n".join(
                  [
                      f"notification_ok={'true' if payload.get('ok') else 'false'}",
                      f"notification_status={payload.get('status', 'unknown')}",
                      f"notification_sent={payload.get('sent', 0)}",
                      f"notification_failed={payload.get('failed', 0)}",
                      f"notification_reason={reason}",
                  ]
              )
              + "\n",
              encoding='utf-8',
          )
          PY
          cat "$NOTIFICATION_OUTPUT_FILE" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "Notification script exited with code $status"
            echo "Notification stderr:"
            cat "$NOTIFICATION_STDERR_FILE"
          fi

      - name: Commit updated artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add \
            "dataset/Gold Rate.csv" \
            dataset/USD-INR.csv \
            dataset/macro_data.csv \
            dataset/prediction_logs.csv \
            dataset/sentiment_logs.csv \
            frontend/public/snapshots/*.json \
            ml/model/pending_prediction.json \
            ml/model/system_status.json \
            2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi

          git commit -m "daily: evaluate + snapshot $(date -u '+%Y-%m-%d')"

          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            if [ "$attempt" -eq 3 ]; then
              echo "Artifact push failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

      - name: Write job summary
        run: |
          echo "## Daily GoldSense Pipeline - $(date -u '+%Y-%m-%d')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Avg D1 MAPE | ${{ steps.evaluate.outputs.avg_mape }}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| D1 Direction Accuracy | ${{ steps.evaluate.outputs.direction_accuracy }}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Drift Detected | ${{ steps.evaluate.outputs.drift_detected }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Retrain Recommended | ${{ steps.evaluate.outputs.retrain_recommended }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Snapshot Price Source | ${{ steps.snapshots.outputs.today_source }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Snapshot Market Status | ${{ steps.snapshots.outputs.today_market_status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Notifications | ${{ steps.notifications.outputs.notification_status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Notification Sent | ${{ steps.notifications.outputs.notification_sent }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Notification Failed | ${{ steps.notifications.outputs.notification_failed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Drift note: ${{ steps.evaluate.outputs.drift_message }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Notification note: ${{ steps.notifications.outputs.notification_reason }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.snapshots.outputs.today_source }}" = "dataset_close" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Live providers fell back to dataset close for this run, so public prices are delayed rather than live." >> "$GITHUB_STEP_SUMMARY"
          fi
