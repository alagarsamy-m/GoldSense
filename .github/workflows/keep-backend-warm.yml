name: Keep Backend Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ secrets.RENDER_HEALTHCHECK_URL }}" ]; then
            echo "RENDER_HEALTHCHECK_URL is not configured"
            exit 0
          fi
          curl -fsSL "${{ secrets.RENDER_HEALTHCHECK_URL }}" || true
