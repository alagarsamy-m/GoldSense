name: Weekly Model Retraining

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install -r backend/requirements.txt

      - name: Refresh market data
        run: |
          cd ml
          python update_data.py

      - name: Refresh sentiment
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          cd ml
          python sentiment_service.py --refresh
        continue-on-error: true

      - name: Evaluate outstanding forecasts
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          cd ml
          python evaluate.py
        continue-on-error: true

      - name: Retrain XGBoost models
        run: |
          cd ml
          python train.py

      - name: Generate public snapshots
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          cd ml
          python generate_public_snapshots.py

      - name: Commit updated model and artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add \
            "dataset/Gold Rate.csv" \
            dataset/USD-INR.csv \
            dataset/macro_data.csv \
            dataset/prediction_logs.csv \
            dataset/sentiment_logs.csv \
            frontend/public/snapshots/*.json \
            ml/model/gold_model.pkl \
            ml/model/gold_model_q10.pkl \
            ml/model/gold_model_q90.pkl \
            ml/model/gold_direction_model.pkl \
            ml/model/model_metadata.json \
            ml/model/pending_prediction.json \
            ml/model/system_status.json \
            2>/dev/null || true
          git diff --staged --quiet || git commit -m "retrain: model + snapshot update $(date -u '+%Y-%m-%d') [skip ci]"
          git push
        continue-on-error: true

      - name: Trigger Render deployment
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deployment triggered"

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.run_number }}
          path: |
            ml/model/gold_model.pkl
            ml/model/gold_model_q10.pkl
            ml/model/gold_model_q90.pkl
            ml/model/gold_direction_model.pkl
            ml/model/model_metadata.json
          retention-days: 30
